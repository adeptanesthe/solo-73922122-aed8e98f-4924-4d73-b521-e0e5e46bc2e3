# Fast, fully offline demo override: heuristic vision backend, no model download.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build
#
# Then open http://localhost:8000/docs (Swagger UI) and try POST /v1/diagnose
# with samples/fault_screenshot.png, samples/question.txt and samples/app_logs.txt.
services:
  api:
    build:
      args:
        # No SmolVLM weights baked in / downloaded: start in seconds.
        PRELOAD_MODEL: "false"
    environment:
      VLM_BACKEND: heuristic
      VLM_LOCAL_FILES_ONLY: "false"
    healthcheck:
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 10
